<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101018">
<title>Kap Sidebar</title>
<style>
:root{color-scheme:dark;--bg:#090a12;--panel:rgba(27,29,48,.54);--panel2:rgba(255,255,255,.07);--line:rgba(255,255,255,.15);--text:#f7f6fc;--muted:#aaa8bb;--accent:#b7a4ff;--accent2:#7c3aed}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}html{min-width:0;scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}body:before,body:after{content:"";position:fixed;z-index:-1;width:72vw;height:72vw;max-width:700px;max-height:700px;border-radius:50%;filter:blur(70px);opacity:.27;pointer-events:none;animation:drift 20s ease-in-out infinite alternate}body:before{top:-24vw;left:-20vw;background:radial-gradient(circle,#7855df 0%,#413b91 35%,transparent 70%)}body:after{right:-28vw;bottom:-30vw;background:radial-gradient(circle,#2e9bba 0%,#4a347f 35%,transparent 70%);animation-delay:-9s}@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(13vw,10vh,0) scale(1.13)}100%{transform:translate3d(-4vw,17vh,0) scale(.92)}}button,input,select{font:inherit}button{touch-action:manipulation}.app{width:min(1120px,100%);margin:auto;padding:clamp(12px,3vw,28px)}
header{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;gap:14px;margin:0 0 22px;padding:17px 19px;border:1px solid rgba(255,255,255,.2);border-radius:21px;background:linear-gradient(115deg,rgba(255,255,255,.12),rgba(255,255,255,.035));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 12px 40px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.16);overflow:hidden}header:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 15%,rgba(255,255,255,.07) 45%,transparent 70%);transform:translateX(-100%);animation:shine 8s ease-in-out infinite}h1{font-size:clamp(24px,5vw,34px);line-height:1.12;letter-spacing:-1.1px;margin:0;font-weight:850;background:linear-gradient(100deg,#fff 10%,#d9ceff 52%,#a6e9ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 28px rgba(177,151,255,.14)}@keyframes shine{0%,70%,100%{transform:translateX(-100%)}85%{transform:translateX(100%)}}.subtitle{margin:5px 0 0;color:var(--muted);font-size:13px}.local{display:none}
.layout{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px;align-items:start}.panel{min-width:0;background:linear-gradient(155deg,rgba(255,255,255,.105),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:18px;padding:clamp(13px,2vw,19px);box-shadow:0 14px 38px #0002,inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}h2{font-size:16px;margin:0 0 13px;text-align:center}h3{font-size:13px;margin:0 0 9px;color:#e6e2f2;text-align:center}
.upload{display:block;border:1.5px dashed rgba(211,199,255,.4);border-radius:14px;background:rgba(255,255,255,.045);padding:13px 12px;text-align:center;cursor:pointer;transition:background .15s,border-color .15s}.upload:active,.upload.drag{border-color:var(--accent);background:#2b2540}.upload-icon{display:block;font-size:24px;color:#c4b5fd;line-height:1.1}.upload strong{display:block;margin:5px 0 2px;font-size:14px}.upload small{color:var(--muted);font-size:12px}.file-name{display:none}#fileInput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.preview-wrap{margin-top:19px;text-align:center}.discord{display:table;background:#25252f;max-width:100%;width:max-content;margin:0 auto;border:1px solid #3b3b48;border-radius:12px;padding:10px}.message{display:inline-flex;min-width:0;max-width:100%;overflow:hidden;border-radius:5px;background:#31323a}.bar{width:5px;flex:0 0 5px;background:#000000;transition:background .12s}.message-content{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px;padding:10px;min-width:0;flex:0 0 auto}.avatar,.placeholder{width:148px;height:222px;aspect-ratio:2/3;object-fit:cover;border-radius:5px;background:#17171d;flex:0 0 auto}.placeholder{display:grid;place-items:center;text-align:center;padding:5px;color:#aaa8bb;font-size:10px;background:#41414d}.hidden{display:none!important}.char-wrap{display:none}.char-name{display:none}.char-sub{font-size:11px;color:#c0bfca;margin-top:4px}.preview-note,.tip{font-size:11px;line-height:1.5;color:var(--muted);margin:9px 0 0}.field-label{display:block;font-size:12px;color:var(--muted);margin:13px 0 6px}.input,.select{width:100%;min-width:0;border:1px solid var(--line);background:rgba(8,9,17,.62);color:var(--text);padding:11px 12px;border-radius:10px;outline:none}.input:read-only{color:#88899a;background:rgba(8,9,17,.42);border-color:rgba(255,255,255,.08)}.command-area{margin-top:4px}.command-area .field-label{margin-top:13px}.command-row{display:flex;gap:5px;align-items:center;border:1px solid rgba(255,255,255,.1);background:rgba(8,9,17,.42);border-radius:10px;padding:4px 5px 4px 9px}.command-input{flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;border:0!important;background:transparent!important;padding:7px 2px;box-shadow:none!important}.save-btn{min-width:76px;height:32px;padding:0 9px;flex:none;border:1px solid rgba(196,181,253,.25);border-radius:8px;background:rgba(139,92,246,.2);font-size:11px;font-weight:750;white-space:nowrap;cursor:pointer;box-shadow:inset 0 1px rgba(255,255,255,.08)}.save-btn:active{transform:scale(.95)}.input:focus,.select:focus{border-color:#9c83ee}.selected:not(.swatch){display:flex;align-items:center;justify-content:center;gap:11px;margin:10px auto 0;padding:9px;max-width:260px;border:1px solid var(--line);background:#22222d;border-radius:12px;min-width:0}.chip{width:40px;height:40px;border-radius:9px;border:1px solid #ffffff33;flex:none}.selected-text{min-width:0;flex:1;text-align:left}.hex-big{font-size:14px;font-weight:850;letter-spacing:.2px}.rgb{display:none;font-size:11px;color:var(--muted);margin-top:2px}.btn{border:1px solid var(--line);border-radius:10px;background:#2b2b38;color:var(--text);padding:10px 12px;font-size:12px;font-weight:650;cursor:pointer}.btn:active{transform:scale(.98)}.btn.primary{background:var(--accent2);border-color:#9368f4;color:white}.btn:disabled{opacity:.45;cursor:wait}.copy{flex:none}.status{padding:25px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:13px}.progress{height:5px;background:#32313f;border-radius:9px;overflow:hidden;margin:12px 0 5px}.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,#8b5cf6,#c4b5fd);transition:width .1s}.palette-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0;color:var(--muted);font-size:11px}.palette{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.swatch{padding:0;min-width:0;text-align:left;overflow:hidden;border:1px solid #ffffff16;border-radius:10px;background:#252530;color:var(--text);cursor:pointer}.swatch.selected{outline:2px solid #c4b5fd;outline-offset:1px;border-color:#c4b5fd}.swatch.selected .swatch-percent{visibility:hidden}.swatch-color{position:relative;isolation:isolate;display:grid;place-items:center;height:clamp(52px,17vw,92px);border-bottom:1px solid #ffffff12;background-position:center;background-size:cover}.swatch-percent{display:flex;position:absolute;inset:0;z-index:1;align-items:center;justify-content:center;background:transparent;color:#fff;font-size:clamp(10px,2.8vw,15px);font-weight:850;line-height:1;text-shadow:0 1px 4px #000;pointer-events:none;white-space:nowrap}.swatch-info{display:block;padding:6px 4px 7px}.hex{display:block;font-size:clamp(8px,2.2vw,10px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.share{display:none}.more-wrap{display:flex;justify-content:center;margin-top:13px}.empty-small{text-align:center;color:var(--muted);padding:18px 8px;font-size:12px}.bottom-note{display:none}
@media(max-width:760px){.app{padding:14px 11px 28px}.layout{grid-template-columns:minmax(0,1fr);gap:12px}.panel{border-radius:15px}.local{font-size:10px;padding:6px 8px}.palette{grid-template-columns:repeat(5,minmax(0,1fr))}.palette-panel{grid-row:2}.preview-panel{grid-row:1}.avatar,.placeholder{width:auto;height:min(340px,62vh);aspect-ratio:2/3;min-height:0;max-width:68vw}}
@media(max-width:380px){header{align-items:center;justify-content:center}.local{display:none}.subtitle{font-size:12px}.palette{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.swatch-color{height:clamp(48px,16vw,76px)}.message-content{padding:10px;gap:8px}.avatar,.placeholder{width:auto;height:min(340px,62vh);aspect-ratio:2/3;min-height:0;max-width:68vw}.selected{gap:8px;padding:9px}.chip{width:35px;height:35px}.btn.copy{padding:9px 8px;font-size:11px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head>
<body><main class="app">
<header><h1>Kap Sidebar</h1></header>
<div class="layout">
<section class="panel preview-panel"><h2>Subir Archivo</h2>
<label class="upload" id="dropzone" for="fileInput"><span class="upload-icon">↥</span><strong>Elegir imagen</strong></label><input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/*">
<div class="preview-wrap"><h3>Vista previa de la sidebar</h3><div class="discord"><div class="message"><div class="bar" id="previewBar"></div><div class="message-content"><div class="placeholder" id="photoPlaceholder">Tu foto<br>2:3</div><img class="avatar hidden" id="previewImage" alt="Tu personaje"></div></div></div>
<label class="field-label" for="nameInput">Nombre del personaje</label><input class="input" id="nameInput" maxlength="70" placeholder="Nombre del personaje">
<div id="commandArea" class="command-area hidden"><label class="field-label" for="commandOutput">Comando</label><div class="command-row"><input class="input command-input" id="commandOutput" value="" readonly aria-label="Comando para copiar"><button class="save-btn" id="copyBtn" aria-label="Copiar comando" title="Copiar comando">🔖 Copy</button></div></div>
<div class="selected"><span class="chip" id="selectedChip" style="background:#000000"></span><div class="selected-text"><div class="hex-big" id="selectedHex">#000000</div><div class="rgb" id="selectedRgb">RGB 0, 0, 0</div><div class="rgb" id="selectedPercent"></div></div></div>
</section>
<section class="panel palette-panel"><h2>Top 10 colores más predominantes de la imagen</h2>
<div id="status" class="status"> ­­­ </div><div class="progress hidden" id="progress"><span id="progressBar"></span></div><div class="palette-meta hidden" id="paletteMeta"><span id="resultCount">0 colores</span><span id="pageInfo"></span></div><div id="palette" class="palette"></div><div class="more-wrap hidden" id="moreWrap"><button class="btn" id="moreBtn">Cargar más colores</button></div></section>
</div></main><canvas id="canvas" hidden></canvas>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const fileInput=$('fileInput'),canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});let exactColors=[],shownColors=[],selectedHex=null,imageUrl=null,rendered=0,filtered=[],busy=false,analysisToken=0,userSelectedColor=false;const PAGE=120,MAX_SIDE=280;
const fmt=n=>Number(n).toLocaleString('es-AR');const hexOf=(r,g,b)=>'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();const rgbOf=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function setSelected(hex,fromTap=false){if(fromTap&&selectedHex===hex.toUpperCase()){selectedHex=null;userSelectedColor=false;document.querySelectorAll('.swatch').forEach(el=>el.classList.remove('selected'));$('commandArea').classList.add('hidden');$('commandOutput').value='';return}if(fromTap)userSelectedColor=true;selectedHex=hex.toUpperCase();$('previewBar').style.background=selectedHex;$('selectedChip').style.background=selectedHex;$('selectedHex').textContent=selectedHex;const [r,g,b]=rgbOf(selectedHex);$('selectedRgb').textContent=`RGB ${r}, ${g}, ${b}`;$('selectedPercent').textContent='';document.querySelectorAll('.swatch').forEach(el=>{el.classList.toggle('selected',el.dataset.hex===selectedHex)});const valid=$('nameInput').value.trim().length>0&&userSelectedColor;$('commandArea').classList.toggle('hidden',!valid);$('commandOutput').value=selectedHex?`$ec ${$('nameInput').value.trim()} $ ${selectedHex}`:'';}
function hue(c){let r=c.r/255,g=c.g/255,b=c.b/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return h}
function updateList(){if(!exactColors.length)return;const totalPixels=exactColors.reduce((sum,c)=>sum+c.count,0);const blackPixels=exactColors.reduce((sum,c)=>sum+(Math.max(c.r,c.g,c.b)<=24?c.count:0),0);const blackDominates=totalPixels>0&&blackPixels/totalPixels>0.5;const candidates=blackDominates?exactColors:exactColors.filter(c=>Math.max(c.r,c.g,c.b)>24);filtered=candidates.slice(0,10);const topTotal=filtered.reduce((sum,c)=>sum+c.count,0);const shares=filtered.map(c=>{const raw=topTotal?c.count/topTotal*100:0;return {hex:c.hex,value:Math.floor(raw),remainder:raw-Math.floor(raw)}});let remaining=100-shares.reduce((sum,x)=>sum+x.value,0);[...shares].sort((a,b)=>b.remainder-a.remainder).slice(0,remaining).forEach(x=>{const target=shares.find(y=>y.hex===x.hex);if(target)target.value++});const percentByHex=new Map(shares.map(x=>[x.hex,x.value]));$('palette').replaceChildren();const frag=document.createDocumentFragment();for(const c of filtered){const btn=document.createElement('button');btn.type='button';btn.className='swatch'+(c.hex===selectedHex?' selected':'');btn.dataset.hex=c.hex;btn.setAttribute('aria-label',`${c.hex} ${percentByHex.get(c.hex)}%`);const color=document.createElement('span');color.className='swatch-color';color.style.background=c.hex;const percent=document.createElement('span');percent.className='swatch-percent';percent.setAttribute('aria-hidden','true');percent.textContent=`${percentByHex.get(c.hex)}%`;color.append(percent);const info=document.createElement('span');info.className='swatch-info';const hx=document.createElement('span');hx.className='hex';hx.textContent=c.hex;info.append(hx);btn.append(color,info);btn.addEventListener('click',()=>setSelected(c.hex,true));frag.append(btn)}$('palette').append(frag);$('resultCount').textContent='10 colores';$('paletteMeta').classList.remove('hidden');$('pageInfo').textContent='Top 10';$('moreWrap').classList.add('hidden');if(selectedHex)setSelected(selectedHex)}
function setStatus(msg){$('status').textContent=msg;$('status').classList.remove('hidden')}
function analyze(img){const token=++analysisToken;busy=true;userSelectedColor=false;$('commandArea').classList.add('hidden');exactColors=[];shownColors=[];filtered=[];rendered=0;$('palette').replaceChildren();$('paletteMeta').classList.add('hidden');$('moreWrap').classList.add('hidden');$('status').classList.remove('hidden');$('status').textContent='Procesando…';$('progress').classList.remove('hidden');$('progressBar').style.width='0%';const scale=Math.min(1,MAX_SIDE/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));canvas.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));canvas.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let data;try{data=ctx.getImageData(0,0,canvas.width,canvas.height).data}catch(e){busy=false;$('progress').classList.add('hidden');setStatus('No se pudo leer la imagen. Probá con un JPG o PNG.');return}const map=new Map(),total=canvas.width*canvas.height;let pos=0;function chunk(){if(token!==analysisToken)return;const stop=Math.min(pos+7000,total);for(let p=pos*4;p<stop*4;p+=4){if(data[p+3]===0)continue;const r=data[p],g=data[p+1],b=data[p+2],qr=r>>3,qg=g>>3,qb=b>>3,key=(qr<<10)|(qg<<5)|qb;let c=map.get(key);if(!c){const rr=Math.min(255,(qr<<3)+4),gg=Math.min(255,(qg<<3)+4),bb=Math.min(255,(qb<<3)+4);c={hex:hexOf(rr,gg,bb),r:rr,g:gg,b:bb,count:0};map.set(key,c)}c.count++}pos=stop;$('progressBar').style.width=(pos/total*100).toFixed(1)+'%';$('status').textContent=`${Math.round(pos/total*100)}%`;if(pos<total){setTimeout(chunk,0);return}exactColors=[...map.values()];exactColors.sort((a,b)=>b.count-a.count);$('status').classList.add('hidden');$('progress').classList.add('hidden');busy=false;updateList()};setTimeout(chunk,0)}
function loadFile(file){if(!file)return;if(!file.type.startsWith('image/')){setStatus('Ese archivo no parece una imagen. Elegí un JPG, PNG o WEBP.');return}if(file.size>25*1024*1024){setStatus('La imagen pesa más de 25 MB. Elegí una más liviana para evitar que el celular se trabe.');return}analysisToken++;if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=URL.createObjectURL(file);$('status').classList.remove('hidden');$('status').textContent='Abriendo imagen…';const img=new Image();img.onload=()=>{if(imageUrl!==img.src)return;$('previewImage').src=imageUrl;$('previewImage').classList.remove('hidden');$('photoPlaceholder').classList.add('hidden');analyze(img)};img.onerror=()=>{setStatus('No se pudo abrir esta imagen. Probá con JPG o PNG.');$('progress').classList.add('hidden')};img.src=imageUrl}
fileInput.addEventListener('change',e=>{loadFile(e.target.files&&e.target.files[0]);e.target.value=''});const dz=$('dropzone');['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>loadFile(e.dataTransfer.files&&e.dataTransfer.files[0]));$('nameInput').addEventListener('input',()=>{$('commandOutput').value=selectedHex?`$ec ${$('nameInput').value.trim()} $ ${selectedHex}`:'';$('commandArea').classList.toggle('hidden',!($('nameInput').value.trim()&&userSelectedColor&&selectedHex))});$('copyBtn').addEventListener('click',async()=>{const b=$('copyBtn'),old=b.textContent,command=$('commandOutput').value;try{await navigator.clipboard.writeText(command)}catch(e){const ta=document.createElement('textarea');ta.value=command;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove()}b.textContent='✓';b.title='Comando copiado';setTimeout(()=>{b.textContent=old;b.title='Copiar comando'},1400)});if(selectedHex)setSelected(selectedHex);
})();
</script></body></html>
